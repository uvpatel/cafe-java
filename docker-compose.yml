services:
  postgres:
    image: postgres:17-alpine
    container_name: cafepos-postgres
    environment:
      POSTGRES_DB: cafepos_db
      POSTGRES_USER: cafepos_user
      POSTGRES_PASSWORD: cafepos_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cafepos_user -d cafepos_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: cafepos-mailpit
    ports:
      - "8025:8025" # Web UI
      - "1025:1025" # SMTP server

  minio:
    image: minio/minio:latest
    container_name: cafepos-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" # API
      - "9001:9001" # Console

volumes:
  postgres_data:
