name: Build, Quality Gate & Test Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Java 21 Build, Quality Check & Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Code Formatting Check (Spotless)
        run: ./mvnw spotless:check

      - name: PMD Static Code Analysis
        run: ./mvnw pmd:check

      - name: Compile Application
        run: ./mvnw compile

      - name: Execute Unit & Modulith Boundary Tests
        run: ./mvnw test

      - name: Run Verification Pipeline & Integration Tests
        run: ./mvnw verify

      - name: Upload Surefire Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-test-reports
          path: target/surefire-reports/
          retention-days: 7

      - name: Upload JaCoCo Code Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco/
          retention-days: 7
